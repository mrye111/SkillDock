<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>SkillDock · Clear — HTML 交互原型</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="prototype-meta"><span>SKILLDOCK <i></i> CLEAR / 03</span><span>HTML 交互原型 <i></i> 示例数据，不操作本地文件</span></div>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#library" aria-label="SkillDock 技能库"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m16 3 12 7-12 7L4 10 16 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m4 16 12 7 12-7M4 22l12 7 12-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="5" r="3" fill="#5A7BF0" stroke="#F9FBFF" stroke-width="2"/></svg><span>SkillDock</span></a>
      <button class="workspace-switch" data-action="libraries"><span class="workspace-icon" data-icon="folder"></span><span><strong id="sidebar-library">Personal Skills</strong><small>本地技能库</small></span><span data-icon="chevrons" class="muted"></span></button>
      <div class="nav-label">工作空间</div>
      <nav class="main-nav" aria-label="主要导航">
        <a href="#library" data-page="library"><span data-icon="layers"></span><span>技能库</span><small id="nav-count">8</small></a>
        <a href="#targets" data-page="targets"><span data-icon="target"></span><span>同步目标</span></a>
        <a href="#history" data-page="history"><span data-icon="history"></span><span>同步历史</span></a>
      </nav>
      <div class="sidebar-bottom"><nav class="main-nav"><a href="#settings" data-page="settings"><span data-icon="settings"></span><span>设置</span></a></nav><div class="sidebar-note"><span class="status-dot green"></span><span>一处维护，随处可用</span></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb"><span>工作空间</span><span class="crumb-separator">/</span><strong id="breadcrumb-current">技能库</strong></div><div class="topbar-right"><span class="quiet-label">本地文件同步</span><span class="topbar-divider"></span><button class="icon-button" data-action="refresh" aria-label="刷新当前页面（F5）" title="刷新（F5）"><span data-icon="refresh"></span></button></div></header>
      <main id="main" tabindex="-1"></main>
      <div id="selection-dock"></div>
    </div>
  </div>
  <footer class="prototype-footer"><span>按现有 API Contract v1.1 设计</span><span>支持页面切换、筛选、同步预览与恢复交互 <span class="footer-line"></span> 所有执行均为模拟</span></footer>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="./app.js"></script>
</body>
</html>
