<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">SkillDock — 一处维护，随处可用</title>
  <desc id="desc">SkillDock 把本地技能库安全地同步到 Codex、Claude Code、Cursor、Copilot 的技能目录：可预览、可备份、可恢复。</desc>

  <defs>
    <linearGradient id="dockbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="26" fill="#F7F9FA" stroke="#DFE7EA" stroke-width="2"/>

  <!-- ======================= 标题区 ======================= -->
  <g id="title-block" transform="translate(64 56)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="3" fill="#0F766E">TAURI 2 · RUST · WINDOWS</text>
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif"
          font-size="64" font-weight="700" fill="#172B36">SkillDock</text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif"
          font-size="30" font-weight="600" fill="#0F766E">一处维护，随处可用。</text>
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif"
          font-size="21" fill="#546772">把本地技能库安全地同步到 Codex / Claude Code / Cursor /</text>
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif"
          font-size="21" fill="#546772">Copilot 的技能目录——可预览、可备份、可恢复。</text>
  </g>

  <!-- 元数据 chips -->
  <g id="meta-chips" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <g transform="translate(64 252)">
      <rect width="176" height="40" rx="20" fill="#E6F4F1" stroke="#0F766E" stroke-opacity="0.35"/>
      <text x="88" y="26" text-anchor="middle" fill="#0F766E">46 项自动化测试</text>
    </g>
    <g transform="translate(252 252)">
      <rect width="196" height="40" rx="20" fill="#E6F4F1" stroke="#0F766E" stroke-opacity="0.35"/>
      <text x="98" y="26" text-anchor="middle" fill="#0F766E">扫描 0.72s / ≤5s</text>
    </g>
    <g transform="translate(460 252)">
      <rect width="206" height="40" rx="20" fill="#E6F4F1" stroke="#0F766E" stroke-opacity="0.35"/>
      <text x="103" y="26" text-anchor="middle" fill="#0F766E">同步 27.0s / ≤30s</text>
    </g>
  </g>

  <!-- ======================= 右侧：源 → 四目标坞座 ======================= -->
  <g id="proof" transform="translate(0 0)">
    <!-- 源卡片 -->
    <g id="source-card">
      <rect x="830" y="44" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#DFE7EA" stroke-width="2"/>
      <rect x="830" y="44" width="8" height="64" rx="4" fill="url(#dockbar)"/>
      <text x="856" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif"
            font-size="19" font-weight="600" fill="#172B36">本地技能库</text>
      <text x="856" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" fill="#546772">127 技能 · 一个真源</text>
      <!-- 芯片（应用图标 motif，动画层） -->
      <g id="anim-chip">
        <rect x="1074" y="56" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
        <rect x="1086" y="68" width="16" height="16" rx="4" fill="#0F766E"/>
      </g>
    </g>

    <!-- 分流箭头（静态） -->
    <g stroke="#0F766E" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 880 116 C 880 150, 744 150, 744 176"/>
      <path d="M 940 116 C 940 150, 848 150, 848 176"/>
      <path d="M 1000 116 C 1000 150, 952 150, 952 176"/>
      <path d="M 1060 116 C 1060 150, 1056 150, 1056 176"/>
    </g>

    <!-- 坞座行：codex（动画落点） -->
    <g id="dock-codex" transform="translate(700 176)">
      <rect x="0" y="0" width="88" height="14" rx="7" fill="url(#dockbar)"/>
      <rect x="0" y="-34" width="16" height="34" rx="8" fill="url(#dockbar)"/>
      <rect x="72" y="-34" width="16" height="34" rx="8" fill="url(#dockbar)"/>
      <text x="44" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="17" fill="#546772">Codex</text>
      <!-- 落位对勾（动画层） -->
      <g id="anim-check" opacity="1">
        <circle cx="44" cy="-46" r="13" fill="#0F766E"/>
        <path d="M 37 -46 l 5 5 l 9 -9" stroke="#FFFFFF" stroke-width="3" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 其余三坞（动画淡入行） -->
    <g id="dock-row-2" opacity="1">
      <g transform="translate(804 176)">
        <rect x="0" y="0" width="88" height="14" rx="7" fill="#0F766E" fill-opacity="0.85"/>
        <rect x="0" y="-34" width="16" height="34" rx="8" fill="#0F766E" fill-opacity="0.85"/>
        <rect x="72" y="-34" width="16" height="34" rx="8" fill="#0F766E" fill-opacity="0.85"/>
        <text x="44" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="17" fill="#546772">Claude</text>
      </g>
      <g transform="translate(908 176)">
        <rect x="0" y="0" width="88" height="14" rx="7" fill="#0F766E" fill-opacity="0.85"/>
        <rect x="0" y="-34" width="16" height="34" rx="8" fill="#0F766E" fill-opacity="0.85"/>
        <rect x="72" y="-34" width="16" height="34" rx="8" fill="#0F766E" fill-opacity="0.85"/>
        <text x="44" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="17" fill="#546772">Cursor</text>
      </g>
      <g transform="translate(1012 176)">
        <rect x="0" y="0" width="88" height="14" rx="7" fill="#0F766E" fill-opacity="0.85"/>
        <rect x="0" y="-34" width="16" height="34" rx="8" fill="#0F766E" fill-opacity="0.85"/>
        <rect x="72" y="-34" width="16" height="34" rx="8" fill="#0F766E" fill-opacity="0.85"/>
        <text x="44" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="17" fill="#546772">Copilot</text>
      </g>
    </g>

    <!-- 底部保护语义注记 -->
    <g transform="translate(700 268)">
      <rect width="440" height="40" rx="10" fill="#FFFFFF" stroke="#DFE7EA"/>
      <path d="M 22 20 l 6 6 l 11 -11" stroke="#0F766E" stroke-width="3" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif"
            font-size="17" fill="#546772">不静默覆盖 · 不自动删除 · 备份失败不执行</text>
    </g>
  </g>
</svg>
